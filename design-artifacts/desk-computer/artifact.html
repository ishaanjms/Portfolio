* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body {
  min-height: 100vh;
  background: #f7f5f0;
  color: #1a1916;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.artifacts-page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 48px 32px 100px;
}

.artifacts-header { margin-bottom: 64px; }

.artifacts-back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 40px;
  color: #777;
  font-size: 14px;
  text-decoration: none;
  transition: color 0.2s ease;
}

.artifacts-back:hover { color: #176b6a; }

.artifacts-eyebrow,
.artifact-tags,
.artifact-number,
.artifact-detail-caption > span {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  line-height: 1.6;
  color: #888;
}

.artifacts-eyebrow { margin-bottom: 16px; color: #176b6a; }

.artifacts-header h1 {
  font-size: clamp(44px, 6vw, 80px);
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: -0.035em;
  margin-bottom: 20px;
}

.artifacts-intro {
  max-width: 640px;
  color: #777;
  font-size: 20px;
  font-weight: 300;
  line-height: 1.5;
}

.artifacts-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 48px 32px;
}

.artifact-card { display: block; color: inherit; text-decoration: none; }

.artifact-card-preview {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  aspect-ratio: 1.35;
  background: #f3f6f3;
  margin-bottom: 22px;
}

.artifact-card-preview img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.35s ease;
}

.artifact-card:hover img { transform: scale(1.025); }

.artifact-card-arrow {
  position: absolute;
  right: 20px;
  bottom: 16px;
  color: #176b6a;
  font-size: 24px;
}

.artifact-card-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.artifact-card h2 { font-size: 24px; font-weight: 500; margin-bottom: 8px; }
.artifact-card > p { color: #777; font-size: 15px; line-height: 1.5; }
.artifact-tags { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; }

.artifact-card:focus-visible,
.artifacts-back:focus-visible { outline: 2px solid #176b6a; outline-offset: 6px; border-radius: 4px; }

.artifact-detail .artifacts-header { margin-bottom: 40px; }
.artifact-detail .artifacts-header h1 { font-size: clamp(40px, 5vw, 64px); }

.artifact-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }

.artifact-download {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 18px;
  border: 1px solid rgba(23, 107, 106, 0.28);
  border-radius: 999px;
  color: #176b6a;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.artifact-download svg { display: block; width: 18px; height: 18px; }
.artifact-download:hover { background: #f0f4f0; border-color: #176b6a; }
.artifact-download:focus-visible { outline: 2px solid #176b6a; outline-offset: 4px; }

.artifact-stage {
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: #f3f6f3;
  padding: 28px;
}

.artifact-stage .desk-computer { width: 100%; max-width: 600px; }

.artifact-detail-caption {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  margin-top: 20px;
}

.artifact-detail-caption p { color: #777; font-size: 13px; line-height: 1.6; }
.artifact-detail-caption > span { flex-shrink: 0; }

@media (max-width: 900px) {
  .artifacts-page { padding: 40px 20px 80px; }
  .artifacts-grid { gap: 40px 24px; }
  .artifact-detail-caption { flex-direction: column; gap: 8px; }
}

@media (max-width: 640px) {
  .artifacts-page { padding: 28px 16px 64px; }
  .artifacts-back { margin-bottom: 32px; }
  .artifacts-header { margin-bottom: 40px; }
  .artifacts-intro { font-size: 17px; }
  .artifacts-grid { grid-template-columns: 1fr; }
  .artifact-stage { padding: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .artifact-download { transition: none; }
  .artifact-card-preview img { transition: none; }
  .artifact-card:hover img { transform: none; }
}

/* Colors and geometry are scoped to the supplied SVG computer. */
.desk-computer {
  --ff: #e5e7e2;
  --fs: #ccd3cd;
  --ft: #f3f4ef;
  --st: #8b9c94;
  --st2: #a3b0a7;
  --kf: #d9e0d7;
  --ks: #bcc9bd;
  --kt: #f4f6ee;
  --kh: #b8dbce;
  --glass: #233e39;
  --phos: #d6eade;
  --sink: #176b6a;
  --glowc: #83c6ac;
  margin: 0;
  min-width: 0;
  width: 100%;
  align-self: center;
}

.desk-computer > svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  filter: drop-shadow(0 18px 18px rgba(32, 66, 52, 0.09));
  border-radius: 16px;
}

.desk-computer > svg:focus,
.desk-computer #mac:focus {
  outline: none;
}

.desk-computer.keyboard-focus > svg:focus,
.desk-computer.keyboard-focus #mac:focus {
  outline: 2px solid #176b6a;
  outline-offset: 5px;
}

.desk-computer .ff { fill: var(--ff); }
.desk-computer .fs { fill: var(--fs); }
.desk-computer .ft { fill: var(--ft); }
.desk-computer .kf { fill: var(--kf); }
.desk-computer .ks { fill: var(--ks); }
.desk-computer .kt { fill: var(--kt); }
.desk-computer polygon { stroke: var(--st); stroke-width: 1; stroke-linejoin: round; }
.desk-computer .kf,
.desk-computer .ks,
.desk-computer .kt { stroke: var(--st2); }
.desk-computer .st { fill: none; stroke: var(--st); stroke-width: 1; }
.desk-computer #mac,
.desk-computer .key { cursor: pointer; }
.desk-computer .key { transition: transform 0.06s; }
.desk-computer .key.down { transform: translateY(3px); }
.desk-computer .key.down .kt { fill: var(--kh); }
.desk-computer .tx {
  font: 10px 'DM Mono', monospace;
  fill: var(--sink);
  white-space: pre;
}

.desk-computer #scr {
  transform-box: fill-box;
  transform-origin: center;
  transform: scaleY(0.01);
  opacity: 0;
  transition: transform 0.32s cubic-bezier(0.5, 0, 0.8, 0.4), opacity 0.04s 0.3s;
}
.desk-computer .open #scr {
  transform: none;
  opacity: 1;
  transition: transform 0.55s cubic-bezier(0.2, 0.9, 0.2, 1), opacity 0.05s;
}
.desk-computer #ln { opacity: 1; transition: opacity 0.15s 0.3s; }
.desk-computer .open #ln { opacity: 0; transition: opacity 0.12s; }
.desk-computer #boot,
.desk-computer #txt,
.desk-computer #ui { opacity: 0; transition: opacity 0.2s; }
.desk-computer .boot #boot,
.desk-computer .on #txt,
.desk-computer .ui #ui { opacity: 1; }
.desk-computer .ui #txt { opacity: 0; }
.desk-computer .cat-pixels { shape-rendering: crispEdges; }
.desk-computer .cat-eyes-closed { opacity: 0; }
.desk-computer .ui .cat-reveal {
  animation: computer-cat-reveal 0.5s steps(3, end) both;
}
.desk-computer .ui .cat-wave {
  animation: computer-cat-wave 1.6s steps(1, end) 0.4s infinite;
}
.desk-computer .ui .cat-eyes {
  animation: computer-cat-blink 4s steps(1, end) 1s infinite;
}
.desk-computer .ui .cat-eyes-closed {
  animation: computer-cat-blink-closed 4s steps(1, end) 1s infinite;
}
.desk-computer .ui .cat-tail {
  animation: computer-cat-tail 2s steps(1, end) infinite;
}
.desk-computer .ui .cat-speech {
  animation: computer-cat-hello 0.3s steps(2, end) 0.6s both;
}
.desk-computer #glow { opacity: 0; transition: opacity 0.8s; }
.desk-computer .open #glow { opacity: 1; }
.desk-computer #led { fill: var(--st2); transition: fill 0.3s; }
.desk-computer .open #led { fill: #57a68b; }
.desk-computer .cur { animation: computer-blink 1s steps(1) infinite; }
.desk-computer.is-paused *,
.desk-computer.is-paused .ui * { animation-play-state: paused; }

@keyframes computer-cat-reveal {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes computer-cat-wave {
  0%, 60%, 100% { transform: translate(0, 0); }
  15%, 45% { transform: translate(4px, -4px); }
  30% { transform: translate(0, -8px); }
}
@keyframes computer-cat-blink {
  0%, 42%, 48%, 100% { opacity: 1; }
  45% { opacity: 0; }
}
@keyframes computer-cat-blink-closed {
  0%, 42%, 48%, 100% { opacity: 0; }
  45% { opacity: 1; }
}
@keyframes computer-cat-tail {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
@keyframes computer-cat-hello {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes computer-blink { 50% { opacity: 0; } }

@media (max-width: 900px) {
  .desk-computer {
    max-width: 340px;
    justify-self: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  .desk-computer *,
  .desk-computer .open #scr { animation: none !important; transition: none !important; }
}

h+=`<g id="kb">${ks}</g>`;
// cable
h+=box(385,394,-73,-51,11,23,KC)+box(monitorU(300),monitorU(311),66,84,20,36,KC);
const bz=(t,a)=>{const m=1-t;return [0,1,2].map(i=>m*m*m*a[0][i]+3*m*m*t*a[1][i]+3*m*t*t*a[2][i]+t*t*t*a[3][i])};
const cp=[[394,-62,17],[440,-30,9],[352+monitorU(300)-300,62,9],[monitorU(311),75,28]];
const N=520,TURNS=30,R=4.4,cl=[],co=[];
for(let i=0;i<=N;i++){const t=i/N,c=P(...bz(t,cp)),c1=P(...bz(Math.max(0,t-.004),cp)),c2=P(...bz(Math.min(1,t+.004),cp));
let tx=c2[0]-c1[0],ty=c2[1]-c1[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
const a=R*Math.min(1,t*14,(1-t)*14),ph=t*TURNS*6.2832,sn=Math.sin(ph)*a,cs=Math.cos(ph)*a*1.25;
cl.push(c.map(n=>n.toFixed(1)).join(','));
co.push([c[0]-ty*sn+tx*cs,c[1]+tx*sn+ty*cs].map(n=>n.toFixed(1)).join(','))}
const cd='M'+co.join(' L'),cc='M'+cl.join(' L');
h+=`<path d="${cc}" transform="translate(0 4)" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="6" stroke-linecap="round" style="filter:blur(2px)"/><path d="${cd}" fill="none" stroke="var(--ks)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${cd}" fill="none" stroke="var(--st)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>`;
$('s').innerHTML=h;


const screen = $('s');
const powerButton = $('mac');
const keyEls = {};
screen.querySelectorAll('.key').forEach(key => { keyEls[key.dataset.k] = key; });
let state = 'off';
let lines = [];
let timers = [];
let demoRunning = false;
let visible = true;

function after(callback, delay) {
  timers.push(window.setTimeout(callback, delay));
}

function clearTimers() {
  timers.forEach(window.clearTimeout);
  timers = [];
  Object.values(keyEls).forEach(key => key.classList.remove('down'));
}

function render() {
  const content = lines.slice(-10);
  for (let i = 0; i < 10; i++) $('l' + i).textContent = content[i] || '';
  if (content.length) {
    const cursor = document.createElementNS(NS, 'tspan');
    cursor.setAttribute('class', 'cur');
    cursor.textContent = '█';
    $('l' + (content.length - 1)).appendChild(cursor);
  }
}

function type(character) {
  if (state !== 'on') return;
  if (!lines.length) lines = ['> '];
  const last = lines.length - 1;
  if (character === 'Backspace') {
    if (lines[last].length > 2) lines[last] = lines[last].slice(0, -1);
  } else if (character === 'Enter') {
    lines.push('> ');
  } else if (lines[last].length >= 20) {
    lines.push('  ' + character.toUpperCase());
  } else {
    lines[last] += character.toUpperCase();
  }
  if (lines.length > 40) lines.shift();
  render();
}

function hit(character) {
  const key = keyEls[character.length === 1 ? character.toUpperCase() : character];
  if (key) {
    key.classList.add('down');
    after(() => key.classList.remove('down'), 100);
  }
  type(character);
}

function stopDemo() {
  if (!demoRunning) return;
  clearTimers();
  demoRunning = false;
  screen.classList.remove('ui');
  lines = ['> '];
  render();
}

function demo() {
  if (state !== 'on' || !visible || document.hidden || reduceMotion) return;
  clearTimers();
  demoRunning = true;
  let delay = 0;
  ['DRAW CAT', 'ADD WAVE', 'SAY HI', 'RUN'].forEach(command => {
    [...command].forEach(character => {
      after(() => hit(character), delay);
      delay += 90;
    });
    after(() => hit('Enter'), delay);
    delay += 260;
  });
  after(() => { lines[lines.length - 1] = 'RENDERING...'; render(); }, delay);
  delay += 700;
  after(() => screen.classList.add('ui'), delay);
  delay += 10000;
  after(() => {
    screen.classList.remove('ui');
    lines = ['> '];
    render();
    demo();
  }, delay);
}

function powerOn() {
  clearTimers();
  state = 'booting';
  powerButton.setAttribute('aria-label', 'Turn computer off');
  powerButton.setAttribute('aria-pressed', 'true');
  screen.classList.add('open');
  function ready() {
    screen.classList.remove('boot');
    screen.classList.add('on');
    state = 'on';
    lines = ['SYSTEM READY.', '', '> '];
    render();
    if (reduceMotion) screen.classList.add('ui');
    else after(demo, 700);
  }
  if (reduceMotion) ready();
  else {
    after(() => screen.classList.add('boot'), 650);
    after(ready, 2200);
  }
}

function powerOff() {
  clearTimers();
  state = 'off';
  demoRunning = false;
  screen.classList.remove('open', 'boot', 'on', 'ui');
  powerButton.setAttribute('aria-label', 'Turn computer on');
  powerButton.setAttribute('aria-pressed', 'false');
}

function togglePower() { state === 'off' ? powerOn() : powerOff(); }

// SVG focus can appear after a pointer click; show outlines only for Tab navigation.
host.addEventListener('pointerdown', () => host.classList.remove('keyboard-focus'), true);
document.addEventListener('keydown', event => {
  if (event.key === 'Tab') host.classList.add('keyboard-focus');
});

powerButton.addEventListener('click', togglePower);
powerButton.addEventListener('keydown', event => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  event.preventDefault();
  event.stopPropagation();
  togglePower();
});

// Capture typing only while this illustration has focus.
host.addEventListener('keydown', event => {
  if (event.metaKey || event.ctrlKey || event.altKey || state !== 'on') return;
  const key = event.key.length === 1 ? event.key.toUpperCase() : event.key;
  if (!keyEls[key]) return;
  event.preventDefault();
  stopDemo();
  screen.classList.remove('ui');
  hit(event.key);
});
$('kb').addEventListener('pointerdown', event => {
  const key = event.target.closest('.key');
  if (!key || state !== 'on') return;
  screen.focus({ preventScroll: true });
  stopDemo();
  screen.classList.remove('ui');
  hit(key.dataset.k);
});

// Pause the looping demo while the hero is off-screen or the tab is hidden.
function updatePlayback() {
  const paused = !visible || document.hidden;
  host.classList.toggle('is-paused', paused);
  if (state !== 'on' || !demoRunning) return;
  clearTimers();
  if (!paused) {
    screen.classList.remove('ui');
    lines = ['> '];
    render();
    demo();
  }
}
new IntersectionObserver(entries => {
  visible = entries[0].isIntersecting;
  updatePlayback();
}).observe(host);
document.addEventListener('visibilitychange', updatePlayback);
powerOn();
})();

  </script>
</body>
